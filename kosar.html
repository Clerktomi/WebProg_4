    </div>
    <script>
        const kosarTermekek = document.getElementById("kosarTermekek");

        let kosar = localStorage.getItem("kosar");

        if(kosar){
            kosar = JSON.parse(kosar);
        } else{
            kosar = [];
        }

        for (let i = 0; i < kosar.length; i++) {
            if(kosar[i].db>0){
                let uj = `
                    <tr>
                        <td>${kosar[i].nev}</td>
                        <td>${kosar[i].db}</td>
                        <td>${Number(kosar[i].ar).toLocaleString('hu-HU')}Ft.</td>
                        <td>${Number(kosar[i].db*kosar[i].ar).toLocaleString('hu-HU')}Ft.</td>
                    </tr>
                `;
                kosarTermekek.innerHTML+=uj;
            }
        }
    </script>
