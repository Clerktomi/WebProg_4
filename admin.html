<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="icon" type="image/x-icon" href="src/logo.avif">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="row p-2" id="header">
            <div class="col-12 d-flex align-items-center justify-content-center">
                <div class="row">
                    <div class="col-6">
                        <h2 class="text-center bold menu">Admin</h2>
                    </div>
                    <div class="col-6">
                        <a href="fooldal.html" class="btn btn-primary">Kezés</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="row my-2" id="modositresz" style="display: none;">
            <form id="modositForm" class="row w-50 d-flex align-items-center justify-content-center">
                <input type="text" placeholder="Új név:" id="ujNev" class="my-3 form-control" required>
                <input type="text" placeholder="Új leírás:" id="ujLeiras" class="my-3 form-control" required>
                <input type="number" placeholder="Új ár:" id="ujAr" class="my-3 form-control" required>
                <button class="btn btn-success my-3" type="submit" onclick="adminJovahagy()">Jóváhagy</button>
            </form>
        </div>
        <div class="row my-4">
            <table>
                <thead>
                    <tr>
                        <th>Név</th>
                        <th>Leírás</th>
                        <th>ár</th>
                        <th>modósít</th>
                    </tr>
                </thead>
                <tbody id="adminTable">

                </tbody>
            </table>
            <div class="row my-2" id="ujtermekResz" style="display: none;">
                <form id="ujTermekForm" class="row w-50 d-flex align-items-center justify-content-center">
                    <input type="text" placeholder="Új név:" id="felveszNev" class="my-3 form-control" required>
                    <input type="text" placeholder="Új leírás:" id="felveszLeiras" class="my-3 form-control" required>
                    <input type="number" placeholder="Új ár:" id="felveszAr" class="my-3 form-control" required>
                    <button class="btn btn-success my-3" type="submit" onclick="termekFeltolt()">Jóváhagy</button>
                </form>
            </div>
            <button class="btn btn-success my-3 w-25" onclick="ujTermek()">Új termék hozzáadása</button>
        </div>
    <div class="container-fluid w-100" id="footer">
        <div class="row d-flex align-items-center justify-content-around">
            <div class="col-4 d-flex align-items-center justify-content-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-instagram" viewBox="0 0 16 16">
                    <path d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.9 3.9 0 0 0-1.417.923A3.9 3.9 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8.001c0 2.172.01 2.444.048 3.297.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.9 3.9 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.9 3.9 0 0 0-.923-1.417A3.9 3.9 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 7.998 0zm-.717 1.442h.718c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599s.453.546.598.92c.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.5 2.5 0 0 1-.599.919c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.5 2.5 0 0 1-.92-.598 2.5 2.5 0 0 1-.6-.92c-.109-.281-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.233s.008-2.388.046-3.231c.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92s.546-.453.92-.598c.282-.11.705-.24 1.485-.276.738-.034 1.024-.044 2.515-.045zm4.988 1.328a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92m-4.27 1.122a4.109 4.109 0 1 0 0 8.217 4.109 4.109 0 0 0 0-8.217m0 1.441a2.667 2.667 0 1 1 0 5.334 2.667 2.667 0 0 1 0-5.334"/>
                </svg>
            </div>
            <div class="col-4 d-flex align-items-center justify-content-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-messenger" viewBox="0 0 16 16">
                    <path d="M0 7.76C0 3.301 3.493 0 8 0s8 3.301 8 7.76-3.493 7.76-8 7.76c-.81 0-1.586-.107-2.316-.307a.64.64 0 0 0-.427.03l-1.588.702a.64.64 0 0 1-.898-.566l-.044-1.423a.64.64 0 0 0-.215-.456C.956 12.108 0 10.092 0 7.76m5.546-1.459-2.35 3.728c-.225.358.214.761.551.506l2.525-1.916a.48.48 0 0 1 .578-.002l1.869 1.402a1.2 1.2 0 0 0 1.735-.32l2.35-3.728c.226-.358-.214-.761-.551-.506L9.728 7.381a.48.48 0 0 1-.578.002L7.281 5.98a1.2 1.2 0 0 0-1.735.32z"/>
                </svg>
            </div>
            <div class="col-4 d-flex align-items-center justify-content-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-cloud-rain-fill" viewBox="0 0 16 16">
                    <path d="M4.158 12.025a.5.5 0 0 1 .316.633l-.5 1.5a.5.5 0 1 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.317m3 0a.5.5 0 0 1 .316.633l-1 3a.5.5 0 1 1-.948-.316l1-3a.5.5 0 0 1 .632-.317m3 0a.5.5 0 0 1 .316.633l-.5 1.5a.5.5 0 1 1-.948-.316l.5-1.5a.5.5 0 0 1 .632-.317m3 0a.5.5 0 0 1 .316.633l-1 3a.5.5 0 1 1-.948-.316l1-3a.5.5 0 0 1 .632-.317m.247-6.998a5.001 5.001 0 0 0-9.499-1.004A3.5 3.5 0 1 0 3.5 11H13a3 3 0 0 0 .405-5.973"/>
                </svg>
            </div>
        </div>
        <div class="row">
            <p class="text-center mt-2">Készítette: Szabó Lili Hanna és Szabó Tamás</p>
        </div>
    </div>
    <script>
        let Osztermekek = localStorage.getItem("kosar");

        const alapTermekek = [
            {nev:"Csirkés tortilla",leiras:"Friss zöldségekkel, fűszeres csirkemellel és joghurtos szósszal töltött tortilla.",ar:1890,i:0,db:0},
            {nev:"Margherita pizza",leiras:"Klasszikus pizza paradicsomszósszal, mozzarellával és friss bazsalikommal.",ar:2490,i:1,db:0},
            {nev:"Sajtburger",leiras:"Szaftos marhahúspogácsa cheddar sajttal, salátával, paradicsommal és házi szósszal.",ar:2290,i:2,db:0},
            {nev:"Cézár saláta",leiras:"Ropogós saláta grillezett csirkével, parmezánnal, krutonnal és cézár öntettel.",ar:1990,i:3,db:0},
            {nev:"Vegán tál",leiras:"Quinoa, sült zöldségek, csicseriborsó és avokádós öntet egy tápláló tálban.",ar:2190,i:4,db:0},
            {nev:"Palacsinta Nutellával",leiras:"Frissen sült palacsinta gazdag Nutella töltelékkel és porcukorral.",ar:1290,i:5,db:0}
        ];

        if (Osztermekek) {
            Osztermekek = JSON.parse(Osztermekek);

            if (Osztermekek.length === 0) {
                Osztermekek = alapTermekek;
                localStorage.setItem("kosar", JSON.stringify(Osztermekek));
            }

        } else {
            Osztermekek = alapTermekek;
            localStorage.setItem("kosar", JSON.stringify(Osztermekek));
        }

        let termekek = localStorage.getItem("kosar");
        const adminTable = document.getElementById("adminTable");
        const modositresz = document.getElementById("modositresz");

        adminTable.innerHTML="";
        if(termekek){
            termekek = JSON.parse(termekek);
            
            for (let i = 0; i < termekek.length; i++) {
                let uj = `
                <tr>
                    <td>${termekek[i].nev}</td>
                    <td>${termekek[i].leiras}</td>
                    <td>${Number(termekek[i].ar).toLocaleString('hu-HU')}Ft.</td>
                    <td>
                        <div class="row">
                            <div class="col-6">
                                <button class="btn btn-warning m-2" onclick="adminModosit(${i})">módosítás</button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-danger m-2" onclick="adminTorol(${i})">Törlés</button>
                            </div>
                        </div>
                    </td>
                </tr>
                 `;
                adminTable.innerHTML+=uj;
                
            }
        }

        function adminTorol(i){
            let kosar = localStorage.getItem("kosar");
            kosar = JSON.parse(kosar);

            kosar.splice(i,1);

            localStorage.setItem("kosar",JSON.stringify(kosar));
            location.reload();
        }

        let modIndex = 0;
        function adminModosit(i){
            modIndex = i;
            modositresz.style.display="block";
        }

        function adminJovahagy(){
            let i = modIndex;

            let nev = document.getElementById("ujNev").value;
            let leiras = document.getElementById("ujLeiras").value;
            let ar = document.getElementById("ujAr").value;

            let kosar = localStorage.getItem("kosar");
            kosar = JSON.parse(kosar);

            kosar[i].nev = nev;
            kosar[i].leiras = leiras;
            kosar[i].ar = ar;

            localStorage.setItem("kosar",JSON.stringify(kosar));
            location.reload();
            modositresz.style.display="none";
        }

        const ujtermekResz = document.getElementById("ujtermekResz");

        function ujTermek(){
            ujtermekResz.style.display="block";
        }

        function termekFeltolt(){
            let nev = document.getElementById("felveszNev").value;
            let leiras = document.getElementById("felveszLeiras").value;
            let ar = document.getElementById("felveszAr").value;

            let kosar = localStorage.getItem("kosar");
            kosar = JSON.parse(kosar);

            let uj = {
                nev:nev,
                leiras:leiras,
                ar:ar,
                i:kosar.length,
                db:0
            };

            kosar.push(uj);

            localStorage.setItem("kosar",JSON.stringify(kosar));
            ujtermekResz.style.display="none";
        }
    </script>
</body>
</html>
